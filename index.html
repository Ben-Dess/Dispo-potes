<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f1"><title>DispoPotes — V2</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DispoPotes">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{font-family:'DM Sans',system-ui,sans-serif;background:#f6f5f1;color:#252621}*{box-sizing:border-box}
body{margin:0;background:#f6f5f1}main{max-width:1030px;margin:auto;padding:0 20px 80px}
header{border-bottom:1px solid #deddd7;padding:19px 0;margin-bottom:38px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{font-size:25px;font-weight:800;letter-spacing:-1.5px;text-decoration:none;color:#222}.brand span{color:#dc5939}
h1{font-size:clamp(31px,5vw,48px);letter-spacing:-1.4px;line-height:1.1;margin:0 0 12px}h2{font-size:20px;letter-spacing:-.5px;margin:0 0 16px}h3{font-size:15px;margin:0 0 13px}
p{color:#717168;line-height:1.55;margin:0 0 14px}.subtle{font-size:13px;color:#77776f}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#bc4e35;font-weight:800;margin-bottom:10px}
.panel{background:white;border:1px solid #e3e1d9;border-radius:12px;padding:23px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.stack{display:grid;gap:16px}
label{display:block;font-weight:700;font-size:12px;margin:12px 0 7px}input,textarea,select{font:inherit;font-size:14px;background:white;border:1px solid #dad8d0;border-radius:8px;padding:12px;color:#222;width:100%;color-scheme:light}textarea{min-height:70px;resize:vertical}
button{font:inherit}.btn{border:1px solid transparent;border-radius:8px;padding:11px 16px;font-size:13px;font-weight:800;min-height:42px;cursor:pointer;background:#e15b3a;color:white}.btn:hover{filter:brightness(.95)}.btn.secondary{background:white;color:#262626;border-color:#dcdad1}.btn.small{padding:7px 11px;min-height:34px}.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#77776f}.hide{display:none!important}
a{color:#d35535}a.item{display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid #eeece6;padding:13px 0;color:#272727;text-decoration:none}a.item:hover{color:#c74c30}a.item:last-child{border:0}.item small{display:block;color:#85857d;margin-top:4px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:5px 8px;background:#f1eee8;border-radius:6px;color:#65645f}.pill.good{background:#e0efe7;color:#286449}.pill.warn{background:#fff1d9;color:#93682a}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.cal-head strong{text-transform:capitalize}.weekday,.day{text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday{font-size:11px;color:#85857c;font-weight:800;padding:8px 0}.day{aspect-ratio:1;background:#f8f7f3;border:1px solid #e9e7e0;border-radius:7px;color:#3c3c37;cursor:pointer;font-size:13px;font-weight:700;min-height:34px}.day.off{opacity:.2;cursor:default}.day.available{background:#285c44;color:white;border-color:#285c44}.day.maybe{background:#f1cf82;color:#533f16;border-color:#e5bb5f}.day.unavailable{background:#e4e0dd;color:#77736e;border-color:#e4e0dd;text-decoration:line-through}.weekday.empty{visibility:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:#77776f}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.bar{height:7px;background:#f0eee8;border-radius:10px;overflow:hidden;display:flex;margin:8px 0}.bar i{height:100%;display:block}.result{border-bottom:1px solid #edeae3;padding:12px 0}.result:last-child{border:0}
.message{padding:12px 15px;background:#f9eddf;color:#885225;border-radius:8px;font-size:13px;margin:12px 0}.success{color:#327152}.error{color:#b43d2b}
.history-note{font-size:12px;color:#777;margin:8px 0 0}.install-note{font-size:12px;color:#777;line-height:1.5}.vote-label{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.vote-label input{width:auto}.vote-label small{margin-left:auto}
#view{min-height:50vh}.profile{font-size:12px;color:#888}.status{font-size:12px;min-height:22px;color:#7f7d72}
@media(max-width:680px){main{padding:0 14px 60px}header{margin-bottom:25px}.cols{grid-template-columns:1fr;gap:0}.panel{padding:18px}.row.wrap{align-items:start}.brand{font-size:22px}h1{font-size:32px}.day{min-height:31px}.profile{max-width:145px;text-align:right}}
</style></head>
<body><main><header><a href="#home" class="brand">dispo<span>potes.</span></a><div class="row"><span id="account" class="profile"></span><button id="logout" class="btn secondary small hide">Déconnexion</button></div></header><div id="view"></div><div id="status" class="status"></div></main>
<script type="module">
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}),monthText=(y,m)=>new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}),iso=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
let db,fs,auth,au,uid,installPrompt=null,unsubscribe=()=>{},calYear=0,calMonth=0,event=null,participants={},group=null,groupMembers={},activities=[],votes={},saving=false;
function status(msg,err=false){$('status').textContent=msg;$('status').className='status '+(err?'error':'')}
function html(t){unsubscribe();unsubscribe=()=>{};$('view').innerHTML=t}
function days(a,b){const out=[],d=new Date(a+'T12:00:00'),end=new Date(b+'T12:00:00');for(let i=0;d<=end&&i<366;i++,d.setDate(d.getDate()+1))out.push(iso(d.getFullYear(),d.getMonth(),d.getDate()));return out}
async function init(){try{const cfg=await(await fetch('./firebase-config.json')).json();const [app,a,f]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);au=a;fs=f;auth=a.getAuth(app.initializeApp(cfg));db=f.getFirestore();await auth.authStateReady();if(auth.currentUser){uid=auth.currentUser.uid;$('account').textContent=auth.currentUser.displayName||auth.currentUser.email;$('logout').classList.remove('hide')}route()}catch(e){console.error(e);html('<div class="panel"><h2>Impossible de démarrer</h2><p>'+esc(e.message)+'</p></div>')}}
async function signin(){
 const provider=new au.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
 try{
   await au.setPersistence(auth,au.browserLocalPersistence);
   await au.signInWithPopup(auth,provider);
   location.reload();
 }catch(e){
   console.error('Google login failed',e);
   let message=e.message||'Connexion impossible';
   if(e.code==='auth/unauthorized-domain')message='Ajoute ben-dess.github.io aux domaines autorisés dans Firebase.';
   else if(['auth/popup-blocked','auth/popup-closed-by-user','auth/operation-not-supported-in-this-environment'].includes(e.code))message='Sur iPhone, ouvre directement DispoPotes dans Safari, désactive le blocage des pop-ups pour ce site et réessaie.';
   else if(message.toLowerCase().includes('missing initial state'))message='La session Google a été interrompue. Ferme l’onglet de connexion, reviens au site et réessaie depuis Safari.';
   status(message,true);
 }
}
$('logout').onclick=async()=>{await au.signOut(auth);location.hash='home';location.reload()};
async function get(path){const d=await fs.getDoc(fs.doc(db,path));return d.exists()?{id:d.id,...d.data()}:null}
async function put(path,obj){return fs.setDoc(fs.doc(db,path),obj)}
async function list(path){const s=await fs.getDocs(fs.collection(db,path));return s.docs.map(d=>({id:d.id,...d.data()}))}
async function route(){if(!auth?.currentUser){html('<div class="panel"><p class="eyebrow">Bienvenue sur DispoPotes</p><h1>On se voit quand ?</h1><p>Connecte-toi avec Google pour organiser des sorties avec tes potes.</p><button class="btn" id="login">Continuer avec Google</button></div>');$('login').onclick=signin;return}const [type,id]=decodeURIComponent(location.hash.slice(1)||'home').split('/');try{status('');if(type==='group'&&id)await showGroup(id);else if(type==='event'&&id)await showEvent(id);else await showHome()}catch(e){console.error(e);html('<div class="panel"><h2>Une erreur est survenue</h2><p>'+esc(e.message)+'</p><a href="#home">Retour à l’accueil</a></div>');status(e.message,true)}}
window.addEventListener('hashchange',route);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=$('installApp');if(b)b.classList.remove('hide')});
async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else status('Sur iPhone : ouvre le menu Partager de Safari puis « Sur l’écran d’accueil ». Sur Android : menu du navigateur → « Installer l’application ».')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
async function saveMyGroup(id){await fs.setDoc(fs.doc(db,'users',uid,'groups',id),{groupId:id,addedAt:fs.serverTimestamp()})}
async function showHome(){html('<div class="row wrap" style="margin-bottom:24px"><div><p class="eyebrow">DispoPotes V2</p><h1>On se voit quand ?</h1><p>Une sortie commence avec un groupe.</p></div></div><div class="cols"><section class="panel"><h2>Mes groupes</h2><div id="groups">Chargement…</div></section><section class="panel"><h2>Nouveau groupe</h2><form id="newGroup"><label>Nom du groupe<input id="groupName" maxlength="60" placeholder="Les potes du samedi" required></label><button class="btn" style="margin-top:15px">Créer le groupe</button></form></section></div><section class="panel"><h2>Installer DispoPotes</h2><p class="install-note">Retrouve les groupes directement depuis ton écran d’accueil.</p><button class="btn secondary hide" id="installApp">Installer l’application</button><p class="install-note">Sur iPhone : Partager → Sur l’écran d’accueil. Sur Android : menu → Installer.</p></section>');
$('installApp').onclick=installApp;if(installPrompt)$('installApp').classList.remove('hide');
$('newGroup').onsubmit=async e=>{e.preventDefault();const name=$('groupName').value.trim();if(!name)return;const b=e.submitter;b.disabled=true;try{const ref=fs.doc(fs.collection(db,'groups'));await put('groups/'+ref.id,{name,ownerId:uid,createdAt:fs.serverTimestamp()});await put('groups/'+ref.id+'/members/'+uid,{name:auth.currentUser.displayName||auth.currentUser.email||'Membre',role:'owner',joinedAt:fs.serverTimestamp()});await saveMyGroup(ref.id);location.hash='group/'+ref.id}catch(err){status(err.message,true);b.disabled=false}};
try{const refs=await list('users/'+uid+'/groups');const groups=await Promise.all(refs.map(async r=>{try{return await get('groups/'+r.id)}catch{return null}}));$('groups').innerHTML=groups.filter(Boolean).map(g=>'<a class="item" href="#group/'+encodeURIComponent(g.id)+'"><span><strong>'+esc(g.name)+'</strong><small>Voir les sorties et les membres</small></span>→</a>').join('')||'<p>Aucun groupe pour le moment.</p>'}catch(e){$('groups').textContent='Impossible de charger les groupes : '+e.message}}
async function showGroup(id){group=await get('groups/'+id);if(!group)throw Error('Groupe introuvable');groupMembers={};const myMembership=await get('groups/'+id+'/members/'+uid);const isMember=!!myMembership;if(!isMember){html('<a href="#home">← Accueil</a><div class="panel" style="margin-top:20px"><p class="eyebrow">Invitation à un groupe</p><h1>'+esc(group.name)+'</h1><p>Rejoins le groupe pour voir les sorties et indiquer tes disponibilités.</p><button id="joinGroup" class="btn">Rejoindre</button></div>');$('joinGroup').onclick=async()=>{try{await put('groups/'+id+'/members/'+uid,{name:auth.currentUser.displayName||auth.currentUser.email||'Membre',role:'member',joinedAt:fs.serverTimestamp()});await saveMyGroup(id);await showGroup(id)}catch(e){status(e.message,true)}};return}
const docs=await list('groups/'+id+'/members');docs.forEach(x=>groupMembers[x.id]=x);
html('<a href="#home" class="subtle">← Mes groupes</a><div class="row wrap" style="margin:18px 0 22px"><div><p class="eyebrow">Groupe</p><h1>'+esc(group.name)+'</h1><p class="subtle">'+docs.length+' membre(s)</p></div><button class="btn secondary" id="shareGroup">Copier l’invitation</button></div><div class="cols"><section class="panel"><h2>Prochaines sorties</h2><div id="groupEvents">Chargement…</div><div style="border-top:1px solid #eee;margin:20px 0"></div><h2>Historique</h2><div id="pastEvents">Chargement…</div></section><section class="stack"><div class="panel"><h2>Créer une sortie</h2><form id="newEvent"><label>Nom de la sortie<input id="eventTitle" maxlength="90" required placeholder="Soirée entre potes"></label><div class="field-row"><div><label>Du</label><input id="start" type="date" required></div><div><label>Au</label><input id="end" type="date" required></div></div><button class="btn" style="margin-top:16px">Créer</button></form></div><div class="panel"><h2>Membres</h2>'+docs.map(m=>'<div class="item" style="padding:8px 0">'+esc(m.name)+(m.role==='owner'?' <span class="pill">Créateur</span>':'')+'</div>').join('')+'</div></section></div>');
$('shareGroup').onclick=()=>copyLink('#group/'+id);const today=new Date();$('start').value=iso(today.getFullYear(),today.getMonth(),today.getDate());const later=new Date(today);later.setDate(later.getDate()+30);$('end').value=iso(later.getFullYear(),later.getMonth(),later.getDate());
$('newEvent').onsubmit=async e=>{e.preventDefault();const title=$('eventTitle').value.trim(),startDate=$('start').value,endDate=$('end').value;if(!title||endDate<startDate||days(startDate,endDate).length>365){status('Période invalide (maximum 365 jours).',true);return}e.submitter.disabled=true;try{const ref=fs.doc(fs.collection(db,'events'));const previous=$('eventTitle').dataset.duplicate?await get('events/'+$('eventTitle').dataset.duplicate):null;await put('events/'+ref.id,{title,groupId:id,createdBy:uid,startDate,endDate,status:'planning',description:(previous?.description||''),location:(previous?.location||''),startTime:(previous?.startTime||''),budget:(previous?.budget||''),confirmedDate:null,createdAt:fs.serverTimestamp(),updatedAt:fs.serverTimestamp()});location.hash='event/'+ref.id}catch(err){status(err.message,true);e.submitter.disabled=false}};
try{
const all=await fs.getDocs(fs.query(fs.collection(db,'events'),fs.where('groupId','==',id)));
const evs=all.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.startDate.localeCompare(a.startDate));
const today=iso(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
const past=evs.filter(x=>(x.confirmedDate||x.endDate)<today);
const upcoming=evs.filter(x=>!past.includes(x));
const card=e=>'<div class="item" style="border-bottom:1px solid #eee;padding:13px 0"><div class="row"><a href="#event/'+encodeURIComponent(e.id)+'" style="color:#272727;text-decoration:none"><b>'+esc(e.title)+'</b><small style="display:block">'+fmt(e.confirmedDate||e.startDate)+'</small></a><span class="pill '+(e.status==='confirmed'?'good':'')+'">'+(e.status==='confirmed'?'Confirmée':'En préparation')+'</span></div></div>';
$('groupEvents').innerHTML=upcoming.map(card).join('')||'<p class="subtle">Pas de sortie à venir.</p>';
$('pastEvents').innerHTML=past.map(e=>card(e)+'<button class="btn secondary small" data-repeat="'+esc(e.id)+'">Recréer cette sortie</button>').join('')||'<p class="subtle">Aucune sortie passée.</p>';
$('pastEvents').querySelectorAll('[data-repeat]').forEach(b=>b.onclick=()=>{
const old=past.find(x=>x.id===b.dataset.repeat);if(!old)return;
$('eventTitle').value=old.title;
$('eventTitle').dataset.duplicate=old.id;
$('eventTitle').focus();
status('Ancienne sortie reprise : vérifie les nouvelles dates et clique sur Créer.');
});
}catch(e){$('groupEvents').textContent='Erreur lors du chargement : '+e.message;$('pastEvents').textContent='Historique indisponible.'}
async function copyLink(hash){const url=new URL(location.href);url.hash=hash;try{await navigator.clipboard.writeText(url.toString());status('Lien copié.')}catch{prompt('Copie ce lien :',url.toString())}}
function availOf(p,date){if(p.availability&&p.availability[date])return p.availability[date];if(p.dates?.includes(date))return 'available';return null}
async function showEvent(id){event=await get('events/'+id);if(!event)throw Error('Sortie introuvable');if(!event.groupId){html('<div class="panel"><h2>Ancienne sortie V1</h2><p>Cette sortie a été créée avant les groupes. Elle reste dans la V1. Les nouvelles sorties V2 appartiennent obligatoirement à un groupe.</p><a href="#home">Retour</a></div>');return}
group=await get('groups/'+event.groupId);groupMembers={};(await list('groups/'+event.groupId+'/members')).forEach(x=>groupMembers[x.id]=x);if(!groupMembers[uid])throw Error('Tu dois rejoindre le groupe pour consulter cette sortie.');const first=new Date(event.startDate+'T12:00:00');calYear=first.getFullYear();calMonth=first.getMonth();await refreshEventData(id);renderEvent()}
async function refreshEventData(id){const [p,a,v]=await Promise.all([list('events/'+id+'/participants'),list('events/'+id+'/activities'),list('events/'+id+'/votes')]);participants={};p.forEach(x=>participants[x.id]=x);activities=a;votes={};v.forEach(x=>votes[x.id]=x)}
function renderEvent(){const mine=participants[uid]||{},owner=event.createdBy===uid;
html('<a href="#group/'+encodeURIComponent(event.groupId)+'" class="subtle">← '+esc(group?.name||'Groupe')+'</a><div class="row wrap" style="margin:18px 0 24px"><div><p class="eyebrow">Sortie '+(event.status==='confirmed'?'confirmée':'en préparation')+'</p><h1>'+esc(event.title)+'</h1><p>'+fmt(event.startDate)+' — '+fmt(event.endDate)+'</p></div><button class="btn secondary" id="shareEvent">Copier le lien</button></div><div class="cols"><div class="stack"><section class="panel"><h2>Mes disponibilités</h2><p class="subtle">Chaque clic fait passer le jour à Disponible, Peut-être, Indisponible, puis Sans réponse.</p><label>Prénom affiché</label><div class="row"><input id="firstName" maxlength="40" value="'+esc(mine.name||auth.currentUser.displayName?.split(' ')[0]||'')+'" placeholder="Ton prénom"><button class="btn secondary" id="saveName">OK</button></div><div class="cal-head" style="margin-top:20px"><button class="btn secondary small" id="prev">‹</button><strong id="calTitle"></strong><button class="btn secondary small" id="next">›</button></div><div class="calendar" id="calendar"></div><div class="legend"><span><i class="dot" style="background:#285c44"></i>Disponible</span><span><i class="dot" style="background:#f1cf82"></i>Peut-être</span><span><i class="dot" style="background:#e4e0dd"></i>Indisponible</span></div></section><section class="panel"><h2>Les meilleures dates</h2><div id="rank"></div></section></div><div class="stack"><section class="panel"><h2>Participants</h2><div id="people"></div></section><section class="panel"><h2>Activités proposées</h2><div id="activities"></div>'+(owner?'<form id="addActivity"><label>Ajouter une idée</label><div class="row"><input id="activityTitle" maxlength="80" placeholder="Escape game, resto..."><button class="btn secondary" type="submit">Ajouter</button></div></form>':'')+'</section><section class="panel"><h2>Informations pratiques</h2><form id="details"><label>Description</label><textarea name="description" '+(!owner?'disabled':'')+'>'+esc(event.description||'')+'</textarea><label>Lieu</label><input name="location" value="'+esc(event.location||'')+'" '+(!owner?'disabled':'')+'><div class="field-row"><div><label>Heure</label><input type="time" name="startTime" value="'+esc(event.startTime||'')+'" '+(!owner?'disabled':'')+'></div><div><label>Budget indicatif</label><input name="budget" maxlength="35" value="'+esc(event.budget||'')+'" '+(!owner?'disabled':'')+' placeholder="20 €"></div></div>'+(owner?'<button class="btn secondary" style="margin-top:13px">Enregistrer</button>':'')+'</form></section><section class="panel"><h2>Date définitive</h2><p class="subtle">'+(event.confirmedDate?'Date confirmée : '+fmt(event.confirmedDate):'Le créateur choisit la date après consultation des disponibilités.')+'</p>'+(owner?'<form id="confirm"><label>Choisir une date</label><input id="confirmedDate" type="date" min="'+event.startDate+'" max="'+event.endDate+'" value="'+esc(event.confirmedDate||event.startDate)+'" required><button class="btn" style="margin-top:12px">Confirmer la date</button>'+(event.confirmedDate?'<button type="button" id="unconfirm" class="btn secondary" style="margin:8px 0 0 8px">Annuler</button>':'')+'</form>':'')+'</section></div></div>');
$('shareEvent').onclick=()=>copyLink('#event/'+event.id);
$('prev').onclick=()=>{const d=new Date(calYear,calMonth-1,1);calYear=d.getFullYear();calMonth=d.getMonth();drawCal()};$('next').onclick=()=>{const d=new Date(calYear,calMonth+1,1);calYear=d.getFullYear();calMonth=d.getMonth();drawCal()};
$('saveName').onclick=()=>setName();
if(owner){$('addActivity').onsubmit=async e=>{e.preventDefault();const title=$('activityTitle').value.trim();if(!title)return;try{await fs.addDoc(fs.collection(db,'events',event.id,'activities'),{title,createdBy:uid});await refreshAndDraw()}catch(err){status(err.message,true)}};
$('details').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const data={description:String(fd.get('description')||'').slice(0,2000),location:String(fd.get('location')||'').slice(0,250),startTime:String(fd.get('startTime')||''),budget:String(fd.get('budget')||'').slice(0,35)};try{await fs.updateDoc(fs.doc(db,'events',event.id),{...data,updatedAt:fs.serverTimestamp()});Object.assign(event,data);status('Informations enregistrées.')}catch(err){status(err.message,true)}};
$('confirm').onsubmit=async e=>{e.preventDefault();const date=$('confirmedDate').value;try{await fs.updateDoc(fs.doc(db,'events',event.id),{confirmedDate:date,status:'confirmed',updatedAt:fs.serverTimestamp()});event.confirmedDate=date;event.status='confirmed';renderEvent();status('Date confirmée.')}catch(err){status(err.message,true)}};
if($('unconfirm'))$('unconfirm').onclick=async()=>{try{await fs.updateDoc(fs.doc(db,'events',event.id),{confirmedDate:null,status:'planning',updatedAt:fs.serverTimestamp()});event.confirmedDate=null;event.status='planning';renderEvent()}catch(err){status(err.message,true)}}}
drawCal();drawRank();drawPeople();drawVotes()}
async function setName(){const name=$('firstName').value.trim();if(!name){status('Entre un prénom.',true);return false}const p=participants[uid]||{};try{await put('events/'+event.id+'/participants/'+uid,{name,availability:p.availability||Object.fromEntries((p.dates||[]).map(d=>[d,'available']))});participants[uid]={...p,name,availability:p.availability||Object.fromEntries((p.dates||[]).map(d=>[d,'available']))};drawPeople();drawRank();status('Prénom enregistré.');return true}catch(e){status(e.message,true);return false}}
function drawCal(){$('calTitle').textContent=monthText(calYear,calMonth);const el=$('calendar');el.innerHTML='';for(const d of ['L','M','M','J','V','S','D'])el.innerHTML+='<span class="weekday">'+d+'</span>';const offset=(new Date(calYear,calMonth,1).getDay()+6)%7;for(let i=0;i<offset;i++)el.append(document.createElement('span'));const max=new Date(calYear,calMonth+1,0).getDate();for(let i=1;i<=max;i++){const date=iso(calYear,calMonth,i),valid=date>=event.startDate&&date<=event.endDate,active=availOf(participants[uid]||{},date);const b=document.createElement('button');b.className='day'+(!valid?' off':'')+(active?' '+active:'');b.textContent=i;b.disabled=!valid;b.title=active||'Sans réponse';b.onclick=async()=>{if(saving)return;if(!participants[uid]?.name){const ok=await setName();if(!ok)return}saving=true;const p=participants[uid],a={...(p.availability||Object.fromEntries((p.dates||[]).map(d=>[d,'available'])))};const next={null:'available',available:'maybe',maybe:'unavailable',unavailable:null}[a[date]||'null'];if(next)a[date]=next;else delete a[date];const old={...p};participants[uid]={...p,availability:a};drawCal();drawRank();try{await put('events/'+event.id+'/participants/'+uid,{name:p.name,availability:a})}catch(e){participants[uid]=old;drawCal();drawRank();status(e.message,true)}finally{saving=false}};el.append(b)}}
function drawPeople(){$('people').innerHTML=Object.keys(participants).length?Object.values(participants).map(p=>'<span class="pill" style="margin:3px">'+esc(p.name)+'</span>').join(''):'Aucune réponse pour le moment.'}
function drawRank(){const members=Object.values(participants);if(!members.length){$('rank').textContent='Aucune disponibilité renseignée.';return}const ranked=days(event.startDate,event.endDate).map(date=>({date,yes:members.filter(p=>availOf(p,date)==='available').length,maybe:members.filter(p=>availOf(p,date)==='maybe').length})).filter(x=>x.yes||x.maybe).sort((a,b)=>b.yes-a.yes||b.maybe-a.maybe||a.date.localeCompare(b.date));$('rank').innerHTML=ranked.slice(0,20).map(x=>'<div class="result"><div class="row"><b>'+fmt(x.date)+'</b><span class="subtle">'+x.yes+' oui · '+x.maybe+' peut-être / '+members.length+'</span></div><div class="bar"><i style="background:#285c44;width:'+(x.yes/members.length*100)+'%"></i><i style="background:#e7bf63;width:'+(x.maybe/members.length*100)+'%"></i></div></div>').join('')||'Aucune date proposée pour le moment.'}
function drawVotes(){const mine=votes[uid]?.activityIds||[];const el=$('activities');if(!activities.length){el.innerHTML='<p class="subtle">Aucune activité proposée pour le moment.</p>';return}el.innerHTML='<p class="subtle">Tu peux voter pour plusieurs activités.</p>'+activities.map(a=>{const n=Object.values(votes).filter(v=>(v.activityIds||[]).includes(a.id)).length;return '<label class="vote-label"><input type="checkbox" data-activity="'+esc(a.id)+'" '+(mine.includes(a.id)?'checked':'')+'><span>'+esc(a.title)+'</span><small>'+n+' vote(s)</small></label>'}).join('');el.querySelectorAll('input[data-activity]').forEach(c=>c.onchange=async()=>{const ids=[...el.querySelectorAll('input[data-activity]:checked')].map(x=>x.dataset.activity);try{await put('events/'+event.id+'/votes/'+uid,{activityIds:ids,updatedAt:fs.serverTimestamp()});votes[uid]={activityIds:ids};drawVotes()}catch(e){status(e.message,true)}})}
async function refreshAndDraw(){await refreshEventData(event.id);renderEvent()}
await init();
</script></body></html>
