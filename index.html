/* Pop & social v3: playful sticker-book identity */
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');
:root{--ink:#202039;--violet:#6848ed;--pink:#ff6ba7;--lemon:#ffde59;--mint:#76edc1;--blue:#8ac9ff;background:#fff9e9;color:var(--ink)}
body{background:#fff9e9;background-image:radial-gradient(circle at 7% 10%,#ffefae 0 0.6%,transparent .7%),radial-gradient(circle at 92% 17%,#fecae1 0 1.2%,transparent 1.3%),radial-gradient(circle at 84% 54%,#dfccff 0 .75%,transparent .85%);background-size:410px 410px,600px 600px,540px 540px}
h1,h2,h3,.brand,.event-card-body strong{font-family:'Fredoka','DM Sans',system-ui,sans-serif}
h1{font-size:clamp(42px,6vw,74px);line-height:1.02;letter-spacing:-1.7px;color:#262044}
h2{font-size:25px;letter-spacing:-.45px;color:#2b254b}
header{background:transparent;border-bottom:3px solid var(--ink);padding:18px 0 21px;margin-bottom:27px}
.brand{font-size:31px;color:var(--ink);letter-spacing:-1.1px}
.brand span{color:#ea478c}
.profile{font-weight:700;color:#4a3f63}
.panel{border:2px solid var(--ink);border-radius:24px;box-shadow:5px 6px 0 var(--ink);background:#fff;padding:25px;transition:box-shadow .2s,transform .2s}
.panel:hover{box-shadow:6px 7px 0 var(--ink)}
.panel:focus-within{border-color:var(--ink)}
.btn{background:var(--violet);color:white;border:2px solid var(--ink);border-radius:16px;box-shadow:3px 4px 0 var(--ink);font-weight:800;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{background:#795bfd;transform:translate(1px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.btn.secondary{background:var(--lemon);border-color:var(--ink);color:var(--ink);box-shadow:3px 4px 0 var(--ink)}
.btn.secondary:hover{background:#ffe884}
.btn:focus-visible,.event-card:focus-visible,.day:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
input,textarea,select{border:2px solid #d6d0e5;border-radius:13px;background:#fff;min-height:45px}
input:focus,textarea:focus{border-color:var(--violet)}
.eyebrow{letter-spacing:.09em;font-size:12px;color:#623cb3}
.hero-wrap{min-height:250px;position:relative;border:2px solid var(--ink);border-radius:28px;background:#ffde59;padding:35px 36px;margin-bottom:26px!important;box-shadow:6px 7px 0 var(--ink);overflow:hidden}
.hero-copy{max-width:730px;position:relative;z-index:2}
.hero-wrap h1{margin:10px 0 16px;max-width:710px}
.hero-wrap p:not(.eyebrow){font-size:16px;color:#332b4b;font-weight:600;max-width:450px}
.highlight-text{display:inline;position:relative;z-index:0;color:#fff;white-space:nowrap;text-shadow:2px 2px 0 var(--ink)}
.highlight-text:before{content:"";background:#fb5299;position:absolute;inset:8% -7% 0;transform:rotate(-3deg);border-radius:9px;border:2px solid var(--ink);z-index:-1}
.hero-doodles{position:absolute;right:3%;top:8%;width:24%;height:85%;pointer-events:none}
.doodle{position:absolute;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:700}
.doodle-one{font-size:67px;color:#f7509d;top:2%;right:23%;transform:rotate(16deg);-webkit-text-stroke:2px var(--ink);animation:float-a 4s ease-in-out infinite}
.doodle-two{font-size:79px;color:#7950ec;bottom:4%;right:6%;transform:rotate(19deg);-webkit-text-stroke:2px var(--ink);animation:float-a 3.4s ease-in-out infinite reverse}
.doodle-three{font-size:54px;color:#fff;top:29%;left:8%;transform:rotate(-15deg);-webkit-text-stroke:2px var(--ink);animation:float-a 3.6s ease-in-out infinite}
@keyframes float-a{0%,100%{translate:0 0}50%{translate:0 -10px}}
.event-card{background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:16px;margin-bottom:16px;transition:transform .15s,box-shadow .15s}
.event-card:nth-child(3n+1){background:#f9e7f4}.event-card:nth-child(3n+2){background:#e0f8ef}.event-card:nth-child(3n){background:#e5e9ff}
.event-card:hover{transform:translate(2px,2px);box-shadow:1px 2px 0 var(--ink);border-color:var(--ink)}
.event-card-emoji{width:58px;height:58px;background:#ffde59;border:2px solid var(--ink);border-radius:17px;transform:rotate(-7deg);font-size:29px}
.event-card-body strong{font-size:19px;color:var(--ink);font-weight:700}
.event-card-action{border-radius:10px;background:var(--violet);color:#fff;padding:9px 10px;white-space:nowrap}
.pill{border:1.5px solid var(--ink);background:#ecddff;color:#442873}
.pill.good{background:var(--mint);color:#213d36}.pill.warn{background:var(--lemon);color:#483b17}
.event-heading{border:2px solid var(--ink);box-shadow:5px 6px 0 var(--ink);border-radius:23px;background:linear-gradient(105deg,#ffd4e8 5%,#dcd3ff 70%);padding:28px 26px}
.event-heading h1{font-size:clamp(35px,5vw,58px)}
.day{background:#f5f3fb;border:2px solid #e1dcec;border-radius:12px;font-size:14px;font-weight:800}
.day:not(:disabled):hover{border-color:var(--ink);transform:rotate(-3deg)}
.day.available{background:#55d9a4;color:#173e32;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.day.maybe{background:#ffdc62;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.day.unavailable{background:#f5b5c8;color:#5d253b;border-color:var(--ink)}
.bar{background:#f2ecff;border:1px solid #ded4ef;height:12px}
.vote-label{background:#faf8ff;border-radius:12px;padding:11px 13px;margin-bottom:7px;border:1px solid #ece5f7}
.vote-label input{accent-color:var(--violet);width:20px;height:20px}
label{color:#36304e}
a.item{background:#f8f4ff;border-radius:14px;padding:14px 16px;margin:8px 0;border:1px solid #eee4fc}
a.item:hover{background:#eee5ff}
#status{font-weight:700}
@media(max-width:760px){.hero-wrap{padding:27px 22px;min-height:230px}.hero-wrap h1{font-size:clamp(39px,8vw,54px)}.hero-doodles{right:-6%;opacity:.26;width:39%}.cols{gap:3px}}
@media(max-width:680px){header{padding-top:15px}.brand{font-size:27px}.panel{padding:18px;border-radius:19px;box-shadow:4px 5px 0 var(--ink)}.panel:hover{box-shadow:4px 5px 0 var(--ink)}.hero-wrap{padding:24px 19px;box-shadow:4px 5px 0 var(--ink)}.hero-wrap h1{font-size:clamp(36px,9vw,48px)}.hero-wrap p:not(.eyebrow){font-size:14px}.event-card{padding:12px;gap:9px}.event-card-emoji{width:45px;height:45px;font-size:23px}.event-card-action{font-size:11px;padding:7px}.event-card-body strong{font-size:16px}.btn{border-radius:13px}h2{font-size:23px}.day{min-height:32px;border-radius:9px}}
@media(prefers-reduced-motion:reduce){.doodle{animation:none}.btn,.event-card,.panel{transition:none}}

/* Avatar builder and playful poll cards */
.profile-link{color:#221c40;background:#80ebbd;border:2px solid #25213e;border-radius:15px;padding:9px 12px;text-decoration:none;font-size:13px;font-weight:800;box-shadow:2px 3px 0 #25213e;white-space:nowrap}
.profile-link:hover{background:#b1f7d4}
.profile-editor{max-width:780px;margin:20px auto}
.profile-editor h1{font-size:clamp(34px,5vw,52px)}
.avatar-preview{width:162px;height:162px;background:#fff1a0;border:3px solid #282040;box-shadow:6px 7px 0 #282040;display:grid;place-items:center;border-radius:36px;margin:24px auto}
.avatar-preview svg{width:136px;height:136px;filter:drop-shadow(1px 3px 0 rgba(0,0,0,.12))}
.avatar-options{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px}
.avatar-choice{cursor:pointer;background:#f2edff;color:#302352;border:2px solid #282040;border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px;min-height:42px}
.avatar-choice.selected{background:#ffdb5a;box-shadow:2px 3px 0 #282040}
.avatar-choice:focus-visible{outline:3px solid #fc5a9f;outline-offset:2px}
.member-card{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #e5deee;font-size:14px;font-weight:800}
.member-card:last-child{border:0}
.member-card svg{flex-shrink:0}
.member-card .pill{margin-left:auto;font-size:10px}
.vote-card{display:flex;align-items:center;gap:10px;padding:14px 12px;margin:0 0 13px;background:#f5efff;border:2px solid #292142;border-radius:16px;box-shadow:3px 4px 0 #292142;cursor:pointer;transition:transform .17s,background .17s,box-shadow .17s}
.vote-card:nth-of-type(3n){background:#e0f9ee}
.vote-card:nth-of-type(3n+1){background:#fff0c3}
.vote-card.chosen{background:#ffdbeb;transform:translate(1px,2px);box-shadow:2px 2px 0 #292142}
.vote-card input[type=checkbox]{flex-shrink:0;accent-color:#6d50e7;width:20px;height:20px;cursor:pointer}
.vote-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.vote-name{font-size:15px;font-weight:800;overflow-wrap:anywhere;color:#261f42}
.leader-label{font-size:9px;color:#fff;background:#7a4be7;padding:4px 6px;border:1px solid #2a2146;border-radius:7px;white-space:nowrap;display:inline-block;vertical-align:middle}
.vote-meter{height:13px;border:2px solid #292142;border-radius:20px;background:#fff;overflow:hidden;display:block}
.vote-meter>span{height:100%;background:#ff69a4;display:block;border-right:2px solid #292142;transition:width .4s ease}
.vote-avatars{display:flex;align-items:center;min-height:31px;padding-left:5px}
.vote-avatar{display:inline-flex;align-items:center;justify-content:center;margin-left:-5px;border-radius:50%;border:2px solid #292142;background:#fff;width:35px;height:35px;overflow:hidden}
.vote-avatar svg{width:31px;height:31px}
.vote-more{font-size:11px;font-weight:800;padding:4px}
.vote-count{font-size:11px;white-space:nowrap;color:#4f3c7a}
@media(max-width:680px){.profile-link{font-size:11px;padding:8px}.vote-card{padding:10px 8px;gap:7px}.vote-name{font-size:13px}.vote-count{font-size:10px}.leader-label{font-size:8px}}
@media(prefers-reduced-motion:reduce){.vote-card,.vote-meter>span{transition:none}}
.event-card-emoji.avatar-event{background:#fff;border-radius:18px;transform:rotate(-5deg);overflow:hidden}.event-card-emoji.avatar-event svg{max-width:100%;max-height:100%}
/* Responsive account actions: prevent logout from overflowing mobile screens */
header{min-width:0;flex-wrap:wrap}
header>.row{min-width:0;max-width:100%;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
header .profile{min-width:0;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header #logout,header .profile-link{flex-shrink:0}
@media(max-width:720px){
 header{align-items:center;gap:10px}
 header>.row{flex:1 1 100%;width:100%;max-width:100%;justify-content:flex-end}
 header .profile{margin-right:auto;text-align:left;max-width:min(42vw,180px)}
 header #logout,header .profile-link{font-size:12px;min-height:37px;padding:7px 11px;box-shadow:2px 2px 0 #25213e}
}
@media(max-width:380px){
 header .profile{display:none}
 header>.row{justify-content:space-between}
 header #logout,header .profile-link{font-size:11px;padding:7px 10px}
}

/* Group mini-games, matching Pop & Social */
.game-entry{display:flex;align-items:center;gap:12px;background:#bbf1dc;border:2px solid #292142;border-radius:22px;box-shadow:5px 6px 0 #292142;padding:20px;margin:0 5px 22px 0;color:#26203f;text-decoration:none}
.game-entry strong,.game-tile strong{font:700 24px Fredoka,sans-serif;display:block}
.game-entry small,.game-session small{font-size:12px;display:block;color:#59526d;margin-top:3px}
.game-entry b,.game-session b{margin-left:auto;white-space:nowrap;font-size:12px}
.game-entry-symbol{width:54px;height:54px;display:grid;place-items:center;font:700 24px Fredoka,sans-serif;background:#ffda5f;border:2px solid #292142;border-radius:16px;transform:rotate(-9deg)}

async function init(){
 let phase='configuration';
 try{
   const response=await fetch('./firebase-config.json',{cache:'no-store'});
   if(!response.ok)throw Error('Configuration introuvable (HTTP '+response.status+')');
   const cfg=await response.json();
   if(!cfg.apiKey||!cfg.projectId||!cfg.appId)throw Error('Configuration Firebase incomplète');
   phase='bibliothèques Firebase';
   const [app,a,f]=await Promise.all([
     import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),
     import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),
     import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')
   ]);
   phase='authentification';
   au=a;fs=f;auth=a.getAuth(app.initializeApp(cfg));db=f.getFirestore();
   await auth.authStateReady();
   if(auth.currentUser){uid=auth.currentUser.uid;$('account').textContent=auth.currentUser.displayName||auth.currentUser.email;$('logout').classList.remove('hide');$('profileLink').classList.remove('hide')}
   route();
 }catch(e){
   console.error('DispoPotes startup failed at '+phase,e);
   const text=phase==='configuration'
     ?'Impossible de récupérer la configuration du site. Vérifie ta connexion puis réessaie.'
     :phase==='bibliothèques Firebase'
       ?'Impossible de charger Firebase depuis www.gstatic.com. Vérifie le réseau, le bloqueur de contenus ou le DNS privé, puis réessaie.'
       :'Impossible d’initialiser ta session Firebase. Réessaie avec une connexion stable.';
   html('<section class="panel" role="alert"><h2>Impossible de démarrer</h2><p>'+esc(text)+'</p><p class="subtle">Étape : '+esc(phase)+' · '+esc(e?.message||'Erreur réseau')+'</p><button id="retryStart" class="btn">Réessayer</button><p class="subtle">Si ça persiste : essaie un autre réseau (Wi-Fi / données mobiles) ou un autre navigateur.</p></section>');
   $('retryStart').onclick=()=>{html('<section class="panel"><p>Reconnexion…</p></section>');init()};
 }
}

   await au.signInWithPopup(auth,provider);
   location.reload();
 }catch(e){
   console.error('Google login failed',e);
   let message=e.message||'Connexion impossible';
   if(e.code==='auth/unauthorized-domain')message='Ajoute ben-dess.github.io aux domaines autorisés dans Firebase.';
   else if(['auth/popup-blocked','auth/popup-closed-by-user','auth/operation-not-supported-in-this-environment'].includes(e.code))message='Sur iPhone, ouvre directement DispoPotes dans Safari, désactive le blocage des pop-ups pour ce site et réessaie.';
   else if(message.toLowerCase().includes('missing initial state'))message='La session Google a été interrompue. Ferme l’onglet de connexion, reviens au site et réessaie depuis Safari.';
   status(message,true);
 }
}

function groupPhotoSvg(title,members){
 const people=members.slice(0,60);
 const columns=Math.min(5,Math.max(1,people.length));
 const rows=Math.max(1,Math.ceil(people.length/columns));
 const width=1000,height=310+rows*190;
 const xStep=width/columns;
 const avatars=people.map((p,i)=>{
   const x=xStep*(i%columns)+xStep/2,y=195+Math.floor(i/columns)*190;
   const n=esc(String(p.name||'Pote').slice(0,17));
   return '<g transform="translate('+Math.round(x-65)+','+y+')">'+avatarSVG(profiles[p.id],130)+'</g>'+
     '<text x="'+Math.round(x)+'" y="'+(y+156)+'" font-size="23" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle" fill="#282042">'+n+'</text>';
 }).join('');
 return '<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">'+
  '<rect width="100%" height="100%" fill="#fff0c3"/><rect x="16" y="16" width="'+(width-32)+'" height="'+(height-32)+'" rx="36" fill="#fff8e5" stroke="#292142" stroke-width="7"/>'+

}
async function downloadGroupPhoto(title,members){
 const svg=groupPhotoSvg(title,members);
 const svgUrl=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
 const img=new Image();
 try{
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Image non générée'));img.src=svgUrl});
   const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=Number(svg.match(/height="(\d+)"/)[1]);
   canvas.getContext('2d').drawImage(img,0,0);
   const blob=await new Promise((resolve,reject)=>canvas.toBlob(x=>x?resolve(x):reject(Error('Conversion PNG impossible')),'image/png'));
   const url=URL.createObjectURL(blob);
   const link=document.createElement('a');link.href=url;link.download='dispopotes-groupe.png';document.body.appendChild(link);link.click();link.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
 }finally{URL.revokeObjectURL(svgUrl)}
}

function renderEvent(){const mine=participants[uid]||{},owner=event.createdBy===uid;
html('<a href="#group/'+encodeURIComponent(event.groupId)+'" class="subtle">← '+esc(group?.name||'Groupe')+'</a><div class="row wrap event-heading" style="margin:18px 0 24px"><div><p class="eyebrow">'+(event.status==='confirmed'?'✅ Sortie confirmée':'✨ Sortie en préparation · tu peux encore tout organiser')+'</p><h1>'+esc(event.title)+'</h1><p>'+fmt(event.startDate)+' — '+fmt(event.endDate)+'</p></div><button class="btn secondary" id="shareEvent">Inviter les potes ↗</button></div><div class="cols"><div class="stack"><section class="panel"><h2>🗓️ Tu es dispo quand ?</h2><p class="subtle">Chaque clic fait passer le jour à Disponible, Peut-être, Indisponible, puis Sans réponse.</p><label>Prénom affiché</label><div class="row"><input id="firstName" maxlength="40" value="'+esc(mine.name||auth.currentUser.displayName?.split(' ')[0]||'')+'" placeholder="Ton prénom"><button class="btn secondary" id="saveName">OK</button></div><div class="cal-head" style="margin-top:20px"><button class="btn secondary small" id="prev">‹</button><strong id="calTitle"></strong><button class="btn secondary small" id="next">›</button></div><div class="calendar" id="calendar"></div><div class="legend"><span><i class="dot" style="background:#285c44"></i>Disponible</span><span><i class="dot" style="background:#f1cf82"></i>Peut-être</span><span><i class="dot" style="background:#e4e0dd"></i>Indisponible</span></div></section><section class="panel"><h2>🏆 Les dates qui cartonnent</h2><div id="rank"></div></section></div><div class="stack"><section class="panel"><h2>🫶 Qui est dans le coup ?</h2><div id="people"></div></section><section class="panel"><h2>🎲 On fait quoi ?</h2><div id="activities"></div>'+(owner?'<form id="addActivity"><label>Ajouter une idée</label><div class="row"><input id="activityTitle" maxlength="80" placeholder="Escape game, resto..."><button class="btn secondary" type="submit">Ajouter</button></div></form>':'')+'</section><section class="panel"><h2>📍 Infos du plan</h2><form id="details"><label>Description</label><textarea name="description" '+(!owner?'disabled':'')+'>'+esc(event.description||'')+'</textarea><label>Lieu</label><input name="location" value="'+esc(event.location||'')+'" '+(!owner?'disabled':'')+'><div class="field-row"><div><label>Heure</label><input type="time" name="startTime" value="'+esc(event.startTime||'')+'" '+(!owner?'disabled':'')+'></div><div><label>Budget indicatif</label><input name="budget" maxlength="35" value="'+esc(event.budget||'')+'" '+(!owner?'disabled':'')+' placeholder="20 €"></div></div>'+(owner?'<button class="btn secondary" style="margin-top:13px">Enregistrer</button>':'')+'</form></section><section class="panel"><h2>📌 On bloque la date !</h2><p class="subtle">'+(event.confirmedDate?'Date confirmée : '+fmt(event.confirmedDate):'Le créateur choisit la date après consultation des disponibilités.')+'</p>'+(owner?'<form id="confirm"><label>Choisir une date</label><input id="confirmedDate" type="date" min="'+event.startDate+'" max="'+event.endDate+'" value="'+esc(event.confirmedDate||event.startDate)+'" required><button class="btn" style="margin-top:12px">Confirmer la date</button>'+(event.confirmedDate?'<button type="button" id="unconfirm" class="btn secondary" style="margin:8px 0 0 8px">Annuler</button>':'')+'</form>':'')+'</section></div></div>');
$('shareEvent').onclick=()=>copyLink('#join/'+encodeURIComponent(event.groupId)+'/'+encodeURIComponent(event.id));
$('prev').onclick=()=>{const d=new Date(calYear,calMonth-1,1);calYear=d.getFullYear();calMonth=d.getMonth();drawCal()};$('next').onclick=()=>{const d=new Date(calYear,calMonth+1,1);calYear=d.getFullYear();calMonth=d.getMonth();drawCal()};
$('saveName').onclick=()=>setName();
if(owner){$('addActivity').onsubmit=async e=>{e.preventDefault();const title=$('activityTitle').value.trim();if(!title)return;try{await fs.addDoc(fs.collection(db,'events',event.id,'activities'),{title,createdBy:uid});await refreshAndDraw()}catch(err){status(err.message,true)}};
$('details').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const data={description:String(fd.get('description')||'').slice(0,2000),location:String(fd.get('location')||'').slice(0,250),startTime:String(fd.get('startTime')||''),budget:String(fd.get('budget')||'').slice(0,35)};try{await fs.updateDoc(fs.doc(db,'events',event.id),{...data,updatedAt:fs.serverTimestamp()});Object.assign(event,data);status('Informations enregistrées.')}catch(err){status(err.message,true)}};
$('confirm').onsubmit=async e=>{e.preventDefault();const date=$('confirmedDate').value;try{await fs.updateDoc(fs.doc(db,'events',event.id),{confirmedDate:date,status:'confirmed',updatedAt:fs.serverTimestamp()});event.confirmedDate=date;event.status='confirmed';renderEvent();status('Date confirmée.')}catch(err){status(err.message,true)}};
if($('unconfirm'))$('unconfirm').onclick=async()=>{try{await fs.updateDoc(fs.doc(db,'events',event.id),{confirmedDate:null,status:'planning',updatedAt:fs.serverTimestamp()});event.confirmedDate=null;event.status='planning';renderEvent()}catch(err){status(err.message,true)}}}
drawCal();drawRank();drawPeople();drawVotes();watchEvent(event.id)}
async function setName(){const name=$('firstName').value.trim();if(!name){status('Entre un prénom.',true);return false}const p=participants[uid]||{};try{await put('events/'+event.id+'/participants/'+uid,{name,availability:p.availability||Object.fromEntries((p.dates||[]).map(d=>[d,'available']))});participants[uid]={...p,name,availability:p.availability||Object.fromEntries((p.dates||[]).map(d=>[d,'available']))};drawPeople();drawRank();status('Prénom enregistré.');return true}catch(e){status(e.message,true);return false}}
function drawCal(){$('calTitle').textContent=monthText(calYear,calMonth);const el=$('calendar');el.innerHTML='';for(const d of ['L','M','M','J','V','S','D'])el.innerHTML+='<span class="weekday">'+d+'</span>';const offset=(new Date(calYear,calMonth,1).getDay()+6)%7;for(let i=0;i<offset;i++)el.append(document.createElement('span'));const max=new Date(calYear,calMonth+1,0).getDate();for(let i=1;i<=max;i++){const date=iso(calYear,calMonth,i),valid=date>=event.startDate&&date<=event.endDate,active=availOf(participants[uid]||{},date);const b=document.createElement('button');b.className='day'+(!valid?' off':'')+(active?' '+active:'');b.textContent=i;b.disabled=!valid;b.title=active||'Sans réponse';b.onclick=async()=>{if(saving)return;if(!participants[uid]?.name){const ok=await setName();if(!ok)return}saving=true;const p=participants[uid],a={...(p.availability||Object.fromEntries((p.dates||[]).map(d=>[d,'available'])))};const next={null:'available',available:'maybe',maybe:'unavailable',unavailable:null}[a[date]||'null'];if(next)a[date]=next;else delete a[date];const old={...p};participants[uid]={...p,availability:a};drawCal();drawRank();try{await put('events/'+event.id+'/participants/'+uid,{name:p.name,availability:a})}catch(e){participants[uid]=old;drawCal();drawRank();status(e.message,true)}finally{saving=false}};el.append(b)}}
function drawPeople(){$('people').innerHTML=Object.keys(groupMembers).length?Object.entries(groupMembers).map(([id,p])=>'<div class="member-card">'+avatarOf(id,45)+'<span>'+esc(participants[id]?.name||p.name||'Pote')+'</span>'+(participants[id]?'<span class="pill good">A répondu</span>':'<span class="pill">À venir</span>')+'</div>').join(''):'Aucun membre pour le moment.'}
function drawRank(){const members=Object.values(participants);if(!members.length){$('rank').textContent='Aucune disponibilité renseignée.';return}const ranked=days(event.startDate,event.endDate).map(date=>({date,yes:members.filter(p=>availOf(p,date)==='available').length,maybe:members.filter(p=>availOf(p,date)==='maybe').length})).filter(x=>x.yes||x.maybe).sort((a,b)=>b.yes-a.yes||b.maybe-a.maybe||a.date.localeCompare(b.date));$('rank').innerHTML=ranked.slice(0,20).map(x=>'<div class="result"><div class="row"><b>'+fmt(x.date)+'</b><span class="subtle">'+x.yes+' oui · '+x.maybe+' peut-être / '+members.length+'</span></div><div class="bar"><i style="background:#285c44;width:'+(x.yes/members.length*100)+'%"></i><i style="background:#e7bf63;width:'+(x.maybe/members.length*100)+'%"></i></div></div>').join('')||'Aucune date proposée pour le moment.'}
function drawVotes(){
 const el=$('activities');if(!el)return;
 if(!activities.length){el.innerHTML='<p class="subtle">Pas encore de proposition. Le créateur peut lancer le vote !</p>';return}
 const myVotes=votes[uid]?.activityIds||[],total=Object.keys(groupMembers).length||1;
 const ranking=activities.map(a=>({...a,voters:Object.entries(votes).filter(([,v])=>(v.activityIds||[]).includes(a.id)).map(([id])=>id)})).sort((a,b)=>b.voters.length-a.voters.length||a.title.localeCompare(b.title));
 const top=ranking[0].voters.length;
 el.innerHTML='<p class="subtle">Tu peux choisir plusieurs idées. Clique pour voter !</p>'+ranking.map((a,i)=>{
   const checked=myVotes.includes(a.id),leader=a.voters.length&&a.voters.length===top;
   return '<label class="vote-card'+(checked?' chosen':'')+'"><input type="checkbox" data-activity="'+esc(a.id)+'" '+(checked?'checked':'')+'><span class="vote-content"><span class="vote-name">'+esc(a.title)+(leader?' <span class="leader-label">EN TÊTE ★</span>':'')+'</span><span class="vote-meter"><span style="width:'+Math.min(100,a.voters.length/total*100)+'%"></span></span><span class="vote-avatars">'+a.voters.slice(0,9).map(id=>'<span class="vote-avatar" title="'+esc(groupMembers[id]?.name||'Pote')+'">'+avatarOf(id,32)+'</span>').join('')+(a.voters.length>9?'<span class="vote-more">+'+(a.voters.length-9)+'</span>':'')+'</span></span><strong class="vote-count">'+a.voters.length+' vote'+(a.voters.length>1?'s':'')+'</strong></label>';
 }).join('');
 el.querySelectorAll('input[data-activity]').forEach(c=>c.onchange=async()=>{
   const ids=[...el.querySelectorAll('input[data-activity]:checked')].map(x=>x.dataset.activity);
   const prev=votes[uid];votes[uid]={activityIds:ids};drawVotes();
   try{await put('events/'+event.id+'/votes/'+uid,{activityIds:ids,updatedAt:fs.serverTimestamp()});status('Vote enregistré !')}
   catch(e){if(prev)votes[uid]=prev;else delete votes[uid];drawVotes();status('Vote impossible : '+e.message,true)}
 });
}
function watchEvent(id){
 const unsubs=[];
 const fail=e=>status('Synchronisation interrompue : '+e.message,true);
 unsubs.push(fs.onSnapshot(fs.collection(db,'events',id,'participants'),snap=>{
   if(event?.id!==id||!$('calendar'))return;
   const latest={};snap.forEach(d=>latest[d.id]=d.data());
   if(!saving){participants=latest;drawCal();drawPeople();drawRank()}
 },fail));
 unsubs.push(fs.onSnapshot(fs.collection(db,'events',id,'activities'),snap=>{
   if(event?.id!==id||!$('activities'))return;
   activities=snap.docs.map(d=>({id:d.id,...d.data()}));drawVotes()
 },fail));
 unsubs.push(fs.onSnapshot(fs.collection(db,'events',id,'votes'),snap=>{
   if(event?.id!==id||!$('activities'))return;
   votes={};snap.forEach(d=>votes[d.id]=d.data());drawVotes()
 },fail));
 unsubscribe=()=>unsubs.forEach(fn=>fn());
}
async function refreshAndDraw(){await refreshEventData(event.id);renderEvent()}
await init();
</script></body></html>
