name: Repository security checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Scan tracked files and Firestore rule hygiene
        run: node security/check.mjs
      - name: Smoke test existing app
        run: node v2/verify.mjs
